
services:
  backend:
    build:
      context: ./backend
    container_name: emergency-ai-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: emergency-ai-frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    restart: unless-stopped
